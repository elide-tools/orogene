[package]
name = "orogene"
version = "0.3.34"
description = "`node_modules/` package manager and utility toolkit."
readme = "README.md"
build = "build.rs"
license = "Apache-2.0"

authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[package.metadata.release]
tag = true

[package.metadata.wix]
upgrade-guid = "C5FC7FE8-A6AB-4897-8B26-01220D1C3FAD"
path-guid = "D7A7057F-9CE2-4FB0-A0CF-1293469361C5"

[features]
default = ["sentry", "install-tracing-subscriber", "interactive", "npm-auth", "diagnostics"]

# Interactive CLI prompts (first-run telemetry opt-in, `oro login` credentials).
# When disabled, `dialoguer` is not in the dep graph, the telemetry opt-in is
# auto-declined (`Ok(false)`), and the legacy-auth login flow returns an
# error. Embedders that never exercise interactive CLI paths (e.g. WHIPLASH
# driving orogene programmatically) should build with `default-features = false`.
interactive = ["dep:dialoguer", "oro-npm-account?/interactive"]

# npm authentication subcommands: `oro login` + `oro logout`.
# When disabled, `oro-npm-account` is absent from the dep graph entirely,
# dropping its `dialoguer`, `open`, and other transitives. Embedders that
# only use orogene for package resolution (e.g. WHIPLASH) should build with
# this off.
npm-auth = ["dep:oro-npm-account"]

# Diagnostics subcommand: `oro ping`.
# Separate feature for clean scoping; no new deps.
diagnostics = []

# Crash-reporting via Sentry. Pulls `sentry` and installs panic/backtrace
# integrations. When disabled, `Orogene::setup_telemetry` is a no-op stub
# and sentry is not in the dep graph at all. Consumers that embed orogene
# and provide their own crash/telemetry pipeline should build with
# `default-features = false`.
sentry = ["dep:sentry"]

# Install a global `tracing_subscriber` during `Orogene::setup_logging`.
# When disabled, `setup_logging` is a no-op stub — tracing events still
# emit through the macros, but no subscriber is installed globally, so the
# embedder's own subscriber receives them. This is required for concurrent
# embedding alongside other tracing-emitting crates (uv, Elide, etc.) that
# share a single process-wide subscriber.
install-tracing-subscriber = []

[dependencies]
# Workspace Deps
nassun = { version = "=0.3.34", path = "./crates/nassun" }
node-maintainer = { version = "=0.3.34", path = "./crates/node-maintainer" }
oro-client = { version = "=0.3.34", path = "./crates/oro-client" }
oro-common = { version = "=0.3.34", path = "./crates/oro-common" }
oro-config = { version = "=0.3.34", path = "./crates/oro-config" }
oro-npm-account = { version = "=0.3.34", path = "./crates/oro-npm-account", optional = true }
oro-package-spec = { version = "=0.3.34", path = "./crates/oro-package-spec" }
oro-pretty-json = { version = "=0.3.34", path = "./crates/oro-pretty-json" }

# Regular deps
async-trait = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
chrono-humanize = { workspace = true }
clap = { workspace = true, features = ["derive"] }
colored = { workspace = true }
dialoguer = { workspace = true, default-features = false, optional = true }
directories = { workspace = true }
humansize = { workspace = true }
indicatif = { workspace = true }
is_ci = { workspace = true }
is-terminal = { workspace = true }
kdl = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
rand = { workspace = true, default_features = false }
sentry = { workspace = true, default-features = false, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-unicode = { workspace = true }
term_grid = { workspace = true }
term_size = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[workspace]
members = [".", "crates/*"]

[workspace.package]
authors = ["Orogene Maintainers and Contributors"]
edition = "2021"
repository = "https://github.com/orogene/orogene"
homepage = "https://orogene.dev"
rust-version = "1.67.1"

[workspace.dependencies]
anyhow = "1.0.75"
async-compression = "0.4"
async-trait = "0.1.64"
backon = "0.4.0"
base64 = "0.22"
bincode = "1.3.1"
bytecount = "0.6.0"
cacache = { version = "13", default-features = false, features = ["tokio-runtime", "mmap"] }
chrono = "0.4.23"
chrono-humanize = "0.0.11"
clap = "4.2.1"
colored = "2.0.0"
config = { version = "0.15", default-features = false }
console_error_panic_hook = "0.1.7"
darling = "0.21"
dashmap = "6"
derive_builder = "0.20"
dialoguer = { version = "0.10.4", default-features = false }
directories = "6"
dunce = "1.0.3"
flate2 = "1.0.25"
futures = "0.3.26"
indexmap = "2"
indicatif = "0.18"
io_tee = "0.1.1"
is-terminal = "0.4.7"
is_ci = "1.1.1"
http = "1"
http-cache-reqwest = "0.15"
humansize = "1.1.0"
insta = "1.28.0"
js-sys = "0.3.61"
junction = "1.0.0"
kdl = "6"
maplit = "1.0.2"
miette = "7"
mockito = "1.0.0"
node-semver = "2.1.0"
nom = "8"
once_cell = "1.17.1"
open = "5.0.0"
pathdiff = "0.2.1"
percent-encoding = "2.1.0"
petgraph = { version = "0.8", default-features = false }
poloto = "17.1.0"
pretty_assertions = "1.3.0"
proc-macro2 = "1.0.18"
quote = "1.0.7"
rand = { version = "0.8.5", default-features = false }
reflink-copy = "0.1.8"
regex = "1.7.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "stream"] }
reqwest-middleware = "0.4"
resvg = "0.29.0"
rkyv = "0.8"
sentry = { version = "0.31.0", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic"] }
serde = "1.0.152"
serde_json = "1.0.93"
serde-wasm-bindgen = "0.4.5"
ssri = "9.0.0"
