term_size = "0.3.2"
test-case = "3.0.0"
thiserror = "2"
tracing = "0.1.37"
tracing-appender = "0.2.2"
tracing-indicatif = "0.3.13"
tracing-subscriber = "0.3.16"
tsify = { version = "0.4.3", default-features = false }
unicase = "2.6.0"
url = "2.3.1"
walkdir = "2.3.2"
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.34"
wasm-streams = "0.3.0"
which = "8"
wiremock = "0.5.17"
reqwest-retry = "0.7"

# [patch.crates-io]
# cacache = { path = "../cacache-rs" }
# reflink-copy = { path = "../reflink-copy" }

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.3.1"
# The preferred Rust toolchain to use in CI (rustup toolchain syntax)
rust-toolchain-version = "1.72.1"
# CI backends to support
ci = ["github"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "msi"]
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".tar.gz"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Publish jobs to run in CI
pr-run-mode = "plan"
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["msi"]

[build-dependencies]
embed-resource = "1.3.3"

[[bin]]
name = "oro"
path = "src/main.rs"

[profile.release]
lto = "thin"
opt-level = 3
# strip = true
# debug = false
strip = false
debug = true

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"

[dev-dependencies]
backon = { workspace = true }
insta = { workspace = true, features = ["yaml"] }
poloto = { workspace = true }
resvg = { workspace = true }
tempfile = { workspace = true }

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
