[package]
name = "oro-npm-account"
version = "0.3.34"
description = "Configure access token and execute the login process."
readme = "README.md"
license = "Apache-2.0"

authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["interactive"]
# Interactive `oro login` prompts (username/password via dialoguer). Disable
# for embedded/non-interactive use; the Web auth flow does not require this.
interactive = ["dep:dialoguer"]

[dependencies]
oro-client = { version = "=0.3.34", path = "../oro-client" }

base64 = { workspace = true }
tokio = { workspace = true }
dialoguer = { workspace = true, features = ["password"], optional = true }
kdl = { workspace = true }
miette = { workspace = true }
open = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
